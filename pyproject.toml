[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railnexus"
version = "0.1.0"
description = "B2B rail product experimentation, growth and network intelligence portfolio project."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "duckdb>=1.1",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "networkx>=3.3",
  "plotly>=5.24",
  "streamlit>=1.39",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "joblib>=1.4"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
