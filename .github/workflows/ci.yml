name: RailNexus CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt

      - name: Generate deterministic synthetic smoke data
        run: python scripts/generate_synthetic_data.py --sessions 10000

      - name: Build analytics, ML and publication stages
        run: |
          python scripts/build_stage2_warehouse.py
          python scripts/build_stage3_growth_analysis.py
          python scripts/build_stage4_experiment.py
          python scripts/build_stage5_network_intelligence.py
          python scripts/build_stage6_predictive_modelling.py
          python scripts/build_stage7_ai_investigation.py
          python scripts/validate_stage8_app.py
          python scripts/validate_stage9_production.py
          python scripts/build_stage10_publication.py
          python scripts/validate_stage10_publication.py

      - name: Ruff format check
        run: python -m ruff format --check src scripts tests app

      - name: Ruff lint
        run: python -m ruff check src scripts tests app

      - name: Test
        run: python -m pytest -q

      - name: Docker build
        run: docker build -t railnexus-api:ci .
